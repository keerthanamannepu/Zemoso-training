<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: #007bff;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        nav {
            background: #0056b3;
            padding: 1rem;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        section {
            margin-bottom: 2rem;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <p>Welcome to my web presence</p>
    </header>
    
    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>
    
    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>I'm a web developer passionate about creating clean and efficient code.</p>
        </section>
        
        <section id="projects">
            <h2>Projects</h2>
            <p>Check out my latest work and contributions.</p>
        </section>
        
        <section id="contact">
            <h2>Contact</h2>
            <p>Get in touch with me for collaborations and inquiries.</p>
        </section>
    </main>
    
   
</body>
</html>
